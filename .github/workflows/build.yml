name: Build Warung Kita Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WarungKitaSimulator_Fondasi_0_2.zip'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3

      - name: Extract and fix project
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          import shutil
          import os
          import re
          from pathlib import Path

          archive = "WarungKitaSimulator_Fondasi_0_2.zip"
          folder = "WarungKitaSimulator_Versi_0_2"

          if not os.path.isfile(archive):
              raise SystemExit("Project ZIP tidak ditemukan")

          with zipfile.ZipFile(archive, "r") as z:
              z.extractall("extracted")

          source = Path("extracted") / folder

          if not (source / "project.godot").is_file():
              raise SystemExit("project.godot tidak ditemukan")

          shutil.copytree(source, ".", dirs_exist_ok=True)

          script = Path("scripts/main.gd")
          if not script.is_file():
              raise SystemExit("scripts/main.gd tidak ditemukan")

          content = script.read_text(encoding="utf-8")

          content, count = re.subn(
              r'(\bvar\s+product_color)\s*:=',
              r'\1: Color =',
              content
          )

          if count == 0:
              raise SystemExit("Deklarasi product_color tidak ditemukan; periksa kode sumber")

          script.write_text(content, encoding="utf-8")
          print("Perbaikan product_color diterapkan:", count)
          PY

      - name: Prepare Godot settings
        shell: bash
        run: |
          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses || true

          sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Enable ETC2 ASTC
        shell: bash
        run: |
          sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Check Godot scripts
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --editor --import 2>&1 | tee build/import.log

          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" build/import.log; then
            echo "Kesalahan skrip ditemukan. Build dihentikan."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/WarungKitaSimulator.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s build/WarungKitaSimulator.apk
          ls -lh build/WarungKitaSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warung-Kita-Simulator-APK
          path: build/WarungKitaSimulator.apk
          
