
name: Build Warung Kita Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Prepare Godot settings
        shell: bash
        run: |
          mkdir -p /root/.config/godot
          mkdir -p /root/.local/share/godot/export_templates

          cat > /root/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses || true

          sdkmanager --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Check Android requirements
        shell: bash
        run: |
          echo "=== GODOT ==="
          godot --version

          echo "=== JAVA ==="
          java -version

          echo "=== ANDROID SDK ==="
          test -d /usr/lib/android-sdk/build-tools/34.0.0
          test -d /usr/lib/android-sdk/platforms/android-34
          test -d /usr/lib/android-sdk/platform-tools
          test -d /usr/lib/android-sdk/ndk/23.2.8568313

          echo "=== EXPORT TEMPLATES ==="
          ls -lah /root/.local/share/godot/export_templates/
          find /root/.local/share/godot/export_templates -maxdepth 2 -type f

          test -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_release.apk

          echo "=== DEBUG KEYSTORE ==="
          test -f /root/debug.keystore
          keytool -list -keystore /root/debug.keystore \
            -storepass android -alias androiddebugkey

      - name: Import project
        shell: bash
        run: |
          godot --headless --path . --editor --import

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/WarungKitaSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warung-Kita-Simulator-APK
          path: build/WarungKitaSimulator.apk
          
