
name: Build Warung Kita Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    env:
      GODOT_VERSION: "4.3"

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup Godot Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.3.tres

      - name: Check export preset
        run: |
          test -f export_presets.cfg

      - name: Import project
        run: |
          godot --headless --path . --editor --import

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/WarungKitaSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warung-Kita-Simulator-APK
          path: build/WarungKitaSimulator.apk
          
