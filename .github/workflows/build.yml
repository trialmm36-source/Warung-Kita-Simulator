
name: Build Warung Kita Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Prepare Godot Android
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"

          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Verify Android SDK
        run: |
          test -d /usr/lib/android-sdk/build-tools/33.0.2
          test -d /usr/lib/android-sdk/platforms/android-33
          test -d /usr/lib/android-sdk/platform-tools
          test -f /root/debug.keystore
          java -version
          godot --version

      - name: Import project
        run: |
          godot --headless --path . --editor --import

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/WarungKitaSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warung-Kita-Simulator-APK
          path: build/WarungKitaSimulator.apk
          
